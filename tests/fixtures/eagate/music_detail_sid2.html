<!-- Faithful (sanitised) fixture of the "10,000,000,000" detail page.
     Structure verified live 2026-06-26 (with cat= EMPTY & index=2): four difficulty
     areas (diff_BASIC/ADVANCED/EXTREME/MASTER). The level marker is a NESTED element
     <th class="diff_X"><div class="diff_X">N.NN</div></th> (number only). Each metric is a
     <td class="idx_tb h l">LABEL</td><td class="r">VALUE</td> pair; 達成率 = exact % or "-".
     MASTER real values: 2 plays, 2 clears, 達成率 65.15%, hi-score 435855, combo 273.
     NOTE: on a PLAYED song the live 最高ランク cell renders the medal via a CSS class
     (`r score_data_clear`) with no rank letter in the DOM — so in practice parseDetail
     returns rank '-' and buildPayload falls back to the LIST-page rank. This fixture keeps a
     parseable `score_data_rank B` to exercise rankFromFragment. Addressing caveat: scores
     only populate with cat= EMPTY; the (cat,index) detail addressing is still being worked out. -->
